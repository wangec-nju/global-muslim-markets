<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030a0e" />
    <meta
      name="description"
      content="基于 globe.gl 的 3D 穆斯林市场探索器：仅 OIC 57 国可交互，悬停预览市场卡片，点击固定。"
    />
    <meta property="og:title" content="Global Muslim Markets · OIC 市场探索器" />
    <meta
      property="og:description"
      content="3D 地球、OIC 市场高亮、悬浮市场卡片。人口、GDP、家庭消费、互联网与中国贸易数据。"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Global Muslim Markets · OIC 市场探索器</title>
  </head>
  <body>
    <div id="app">
      <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

      <div
        id="globe"
        class="globe-stage"
        aria-label="可交互的 3D 地球，仅 OIC 57 个市场有高亮边界。悬停查看市场预览，点击固定卡片。"
      ></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.1" />
              <path
                d="M3.8 9.7h16.4M3.8 14.3h16.4M12 3.6c2.4 2.3 3.7 5.2 3.7 8.4s-1.3 6.1-3.7 8.4c-2.4-2.3-3.7-5.2-3.7-8.4S9.6 5.9 12 3.6z"
                stroke="currentColor"
                stroke-width="1.1"
              />
            </svg>
          </span>
          <div class="brand__text">
            <h1>Global Muslim Markets</h1>
            <p>
              3D 穆斯林市场探索器
              <span class="brand__dot" aria-hidden="true">·</span>
              <span data-ref="market-count">市场加载中</span>
            </p>
          </div>
        </div>

        <div class="map-legend" aria-label="地图图例">
          <span class="map-legend__item">
            <i class="legend-dot legend-dot--focus" aria-hidden="true"></i>
            <span data-ref="focus-count">重点样本 16</span>
          </span>
          <span class="map-legend__item">
            <i class="legend-dot legend-dot--oic" aria-hidden="true"></i>
            <span data-ref="oic-count">OIC 其他 41</span>
          </span>
        </div>
      </header>

      <div class="hints" aria-hidden="true">
        <span><b>拖拽</b>旋转</span>
        <span><b>滚轮</b>缩放</span>
        <span><b>悬停</b>预览</span>
        <span><b>点击</b>固定</span>
      </div>
      <p class="sr-only">
        操作提示：拖拽旋转地球，滚轮缩放；只有高亮边界的 OIC 市场可以悬停和点击；点击固定卡片，按 Esc 或点击地球空白处关闭卡片。
      </p>

      <div id="card-layer" class="card-layer"></div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="loader__inner">
          <div class="loader__orbit" aria-hidden="true">
            <span class="loader__core"></span>
          </div>
          <p class="loader__title" data-ref="loader-title">正在校准地球坐标</p>
          <p class="loader__sub" data-ref="loader-sub">载入 OIC 市场数据与地图边界</p>
        </div>
      </div>
    </div>

    <noscript>
      <div class="noscript">
        <strong>需要启用 JavaScript</strong>
        <p>该页面使用 WebGL 渲染 3D 地球，请启用 JavaScript 后刷新。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
