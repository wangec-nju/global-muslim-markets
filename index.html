<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030a0e" />
    <meta
      name="description"
      content="基于 globe.gl 的 3D 穆斯林市场探索器：仅 OIC 57 国可交互，悬停预览，点击打开完整国家档案，支持全量搜索。"
    />
    <meta property="og:title" content="Global Muslim Markets · OIC 市场探索器" />
    <meta
      property="og:description"
      content="3D 地球、OIC 市场高亮、悬浮档案卡与完整侧栏。人口、语言、行政区、城市、枢纽、贸易与 HS 数据。"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Global Muslim Markets · OIC 市场探索器</title>
  </head>
  <body>
    <div id="app">
      <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

      <div
        id="globe"
        class="globe-stage"
        aria-label="可交互的 3D 地球，仅 OIC 57 个市场有高亮边界；中国红色高亮且仅悬停。悬停预览，点击打开完整档案。"
      ></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.1" />
              <path
                d="M3.8 9.7h16.4M3.8 14.3h16.4M12 3.6c2.4 2.3 3.7 5.2 3.7 8.4s-1.3 6.1-3.7 8.4c-2.4-2.3-3.7-5.2-3.7-8.4S9.6 5.9 12 3.6z"
                stroke="currentColor"
                stroke-width="1.1"
              />
            </svg>
          </span>
          <div class="brand__text">
            <h1>Global Muslim Markets</h1>
            <p>
              3D 穆斯林市场探索器
              <span class="brand__dot" aria-hidden="true">·</span>
              <span data-ref="market-count">市场加载中</span>
            </p>
          </div>
        </div>

        <button class="search-trigger" type="button" data-ref="search-open" aria-label="搜索全部国家数据">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.4" stroke="currentColor" stroke-width="1.4" />
            <path d="m15.6 15.6 4.2 4.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <span>搜索全部数据</span>
          <kbd>⌘K</kbd>
        </button>

        <div class="map-legend" aria-label="地图图例">
          <span class="map-legend__item">
            <i class="legend-dot legend-dot--focus" aria-hidden="true"></i>
            <span data-ref="focus-count">重点样本 16</span>
          </span>
          <span class="map-legend__item">
            <i class="legend-dot legend-dot--oic" aria-hidden="true"></i>
            <span data-ref="oic-count">OIC 其他 41</span>
          </span>
          <span class="map-legend__item">
            <i class="legend-dot legend-dot--china" aria-hidden="true"></i>
            <span>中国 · 仅悬停</span>
          </span>
        </div>
      </header>

      <div class="hints" aria-hidden="true">
        <span><b>拖拽</b>旋转</span>
        <span><b>滚轮</b>缩放</span>
        <span><b>悬停</b>档案预览</span>
        <span><b>点击</b>完整档案</span>
        <span><b>搜索</b>全部数据</span>
      </div>
      <p class="sr-only">
        操作提示：拖拽旋转地球，滚轮缩放；OIC 市场悬停显示档案卡，点击打开完整侧栏；中国为红色且仅悬停；按 Esc 或点击地球空白处关闭。
      </p>

      <div id="overlay-layer" class="overlay-layer"></div>
      <div id="card-layer" class="card-layer"></div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="loader__inner">
          <div class="loader__orbit" aria-hidden="true">
            <span class="loader__core"></span>
          </div>
          <p class="loader__title" data-ref="loader-title">正在校准地球坐标</p>
          <p class="loader__sub" data-ref="loader-sub">载入 OIC 市场数据与地图边界</p>
        </div>
      </div>
    </div>

    <noscript>
      <div class="noscript">
        <strong>需要启用 JavaScript</strong>
        <p>该页面使用 WebGL 渲染 3D 地球，请启用 JavaScript 后刷新。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
