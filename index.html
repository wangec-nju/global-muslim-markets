<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030a0e" />
    <meta
      name="description"
      content="基于 globe.gl 的 3D 国家与市场探索器：悬停预览国家卡片，点击固定，支持 GitHub Pages 部署。"
    />
    <meta property="og:title" content="Global Muslim Markets · 3D 国家与市场探索器" />
    <meta
      property="og:description"
      content="3D 地球、国家点击、悬浮卡片。卡片外壳与内容渲染解耦，可替换为任意市场数据。"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Global Muslim Markets · 3D 国家与市场探索器</title>
  </head>
  <body>
    <div id="app">
      <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

      <div
        id="globe"
        class="globe-stage"
        aria-label="可交互的 3D 地球。悬停国家预览卡片，点击国家固定卡片。"
      ></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.1" />
              <path
                d="M3.8 9.7h16.4M3.8 14.3h16.4M12 3.6c2.4 2.3 3.7 5.2 3.7 8.4s-1.3 6.1-3.7 8.4c-2.4-2.3-3.7-5.2-3.7-8.4S9.6 5.9 12 3.6z"
                stroke="currentColor"
                stroke-width="1.1"
              />
            </svg>
          </span>
          <div class="brand__text">
            <h1>Global Muslim Markets</h1>
            <p>
              3D 国家与市场探索器
              <span class="brand__dot" aria-hidden="true">·</span>
              <span data-ref="country-count">国家边界加载中</span>
            </p>
          </div>
        </div>

        <div
          id="renderer-switch"
          class="renderer-switch"
          role="group"
          aria-label="卡片内容视图"
        ></div>
      </header>

      <div class="hints" aria-hidden="true">
        <span><b>拖拽</b>旋转</span>
        <span><b>滚轮</b>缩放</span>
        <span><b>悬停</b>预览</span>
        <span><b>点击</b>固定</span>
      </div>
      <p class="sr-only">
        操作提示：拖拽旋转地球，滚轮缩放；悬停国家显示预览卡片，点击固定卡片；按
        Esc 或点击地球空白处关闭卡片。
      </p>

      <div id="card-layer" class="card-layer"></div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="loader__inner">
          <div class="loader__orbit" aria-hidden="true">
            <span class="loader__core"></span>
          </div>
          <p class="loader__title" data-ref="loader-title">正在校准地球坐标</p>
          <p class="loader__sub" data-ref="loader-sub">载入国家边界与夜间影像</p>
        </div>
      </div>
    </div>

    <noscript>
      <div class="noscript">
        <strong>需要启用 JavaScript</strong>
        <p>该页面使用 WebGL 渲染 3D 地球，请启用 JavaScript 后刷新。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
